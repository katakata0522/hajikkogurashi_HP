<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corner Neighbor — リダイレクト中...</title>
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="0; url=/">
  <link rel="canonical" href="https://hajikkoroom.xsrv.jp/">
  <script>
    window.location.replace('/');
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #08070f;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      text-align: center;
      padding: 20px;
    }
    .box {
      background: #141624;
      border: 1px solid #282c3f;
      border-radius: 12px;
      padding: 32px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }
    .logo-badge {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 1px;
      margin-bottom: 16px;
      display: inline-block;
      text-shadow: 0 0 12px rgba(0, 245, 255, 0.5);
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(0, 245, 255, 0.2);
      border-top-color: #00f5ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 16px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .link-fallback {
      display: inline-block;
      margin-top: 18px;
      color: #00f5ff;
      text-decoration: underline;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    .link-fallback:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo-badge">CORNER NEIGHBOR</div>
    <div class="spinner"></div>
    <p style="margin: 8px 0; font-size: 14px; color: #cbd5e1;">公式サイト（トップページ）へ移動しています...</p>
    <p style="margin: 0; font-size: 12px; color: #64748b;">自動的に移動しない場合は下記をクリックしてください</p>
    <a href="/" class="link-fallback">トップページへ移動する</a>
  </div>
</body>
</html>
