name: Deploy Static Site to Xserver

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
      - '.github/**'

permissions:
  contents: read

concurrency:
  group: deploy-hajikkogurashi-hp-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2

      - name: Detect kanji-slicer changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          kanji_slicer_changed="false"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch: deploying kanji-slicer as a fail-safe."
            kanji_slicer_changed="true"
            changed_files=""
          else
            changed_files="$(jq -r '[.commits[]? | (.added[]?, .modified[]?, .removed[]?)] | unique[]?' "$GITHUB_EVENT_PATH" 2>/dev/null || true)"
            if [ -z "$changed_files" ] && git rev-parse "$GITHUB_SHA^1" >/dev/null 2>&1; then
              changed_files="$(git diff --name-only "$GITHUB_SHA^1" "$GITHUB_SHA" 2>/dev/null || true)"
            fi
          fi

          echo "Changed files:"
          if [ -n "$changed_files" ]; then
            echo "$changed_files"
          elif [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "(none detected)"
            echo "::warning::No changed files were detected for a push; deploying kanji-slicer as a fail-safe."
            kanji_slicer_changed="true"
          else
            echo "(manual dispatch)"
          fi

          if [ -n "$changed_files" ] && echo "$changed_files" | grep -qE '^kanji-slicer/'; then
            kanji_slicer_changed="true"
          fi

          echo "kanji_slicer_changed=$kanji_slicer_changed" >> "$GITHUB_OUTPUT"
          echo "Kanji slicer extra deploy: $kanji_slicer_changed"

      - name: Validate static site
        run: |
          pwsh -File ./scripts/static-site-smoke-test.ps1
          pwsh -File ./scripts/home-asset-smoke-test.ps1
          pwsh -File ./scripts/structure-smoke-test.ps1
          pwsh -File ./scripts/local-reference-check.ps1
          bash -n ./scripts/verify-deployment-marker.sh

      - name: Setup Node.js for minigame regression tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install locked minigame test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate minigame logic before deploy
        run: npm run test:minigames:smoke

      - name: Install Playwright Chromium for predeploy regression
        run: npx playwright install --with-deps chromium

      - name: Resolve Playwright Chromium path
        shell: bash
        run: |
          echo "CHROME_PATH=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"

      - name: Validate minigame browser behavior before deploy
        run: npm run test:minigames:browser

      - name: Generate sitemap.xml
        run: pwsh -File ./scripts/generate-sitemap.ps1

      - name: Stamp deployment version
        shell: bash
        run: printf '%s\n' "$GITHUB_SHA" > deploy-version.txt

      - name: Setup SSH
        env:
          XS_SSH_KEY: ${{ secrets.XS_SSH_KEY }}
          XS_HOST: ${{ secrets.XS_HOST }}
          XS_PORT: ${{ secrets.XS_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$XS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$XS_PORT" -H "$XS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || \
            echo "::warning::ssh-keyscan failed; rsync will use StrictHostKeyChecking=accept-new"

      - name: Deploy to Xserver via Rsync
        env:
          XS_HOST: ${{ secrets.XS_HOST }}
          XS_PORT: ${{ secrets.XS_PORT }}
          XS_USER: ${{ secrets.XS_USER }}
          XS_REMOTE_DIR: ${{ secrets.XS_REMOTE_DIR }}
        run: |
          set -euo pipefail
          ssh_opts="-p $XS_PORT -i ~/.ssh/id_rsa -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts"

          rsync_with_retry() {
            local attempt status
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              else
                status=$?
              fi

              if [ "$attempt" -eq 3 ]; then
                return "$status"
              fi

              echo "::warning::rsync attempt $attempt failed with status $status; retrying..."
              sleep $((attempt * 15))
            done
          }

          # 静的ファイルだけを公開先へ同期する
          rsync_with_retry rsync -avz --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "scripts/" \
            --exclude "*.md" \
            --exclude ".gitignore" \
            --exclude ".gitlab-ci.yml" \
            -e "ssh $ssh_opts" \
            ./ $XS_USER@$XS_HOST:$XS_REMOTE_DIR

      - name: Deploy kanji-slicer to playpoint-sim.com
        if: steps.changes.outputs.kanji_slicer_changed == 'true'
        env:
          XS_HOST: ${{ secrets.XS_HOST }}
          XS_PORT: ${{ secrets.XS_PORT }}
          XS_USER: ${{ secrets.XS_USER }}
        run: |
          set -euo pipefail
          ssh_opts="-p $XS_PORT -i ~/.ssh/id_rsa -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts"

          rsync_with_retry() {
            local attempt status
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              else
                status=$?
              fi

              if [ "$attempt" -eq 3 ]; then
                return "$status"
              fi

              echo "::warning::kanji-slicer rsync attempt $attempt failed with status $status; retrying..."
              sleep $((attempt * 15))
            done
          }

          rsync_with_retry rsync -avz --delete \
            -e "ssh $ssh_opts" \
            ./kanji-slicer/ $XS_USER@$XS_HOST:/home/hajikkoroom/playpoint-sim.com/public_html/kanji-slicer/

      - name: Verify deployed commit
        if: success()
        shell: bash
        run: bash ./scripts/verify-deployment-marker.sh "https://hajikkoroom.xsrv.jp/deploy-version.txt" "$GITHUB_SHA"

      - name: SEO deploy confirmation
        if: success()
        run: |
          echo "✅ デプロイ完了 + sitemap.xml 更新済み + commit marker 検証済み"
          echo ""
          echo "📋 SEO 状況:"
          echo "  - sitemap.xml がサーバーに配置されました"
          echo "  - Google: Search Console に sitemap を登録済みであれば自動クロールされます"
          echo "  - 参考: https://hajikkoroom.xsrv.jp/sitemap.xml"
