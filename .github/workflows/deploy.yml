name: Deploy Static Site to Xserver

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'

permissions:
  contents: read

concurrency:
  group: deploy-hajikkogurashi-hp-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect deployment impact
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          deploy_needed="true"
          kanji_slicer_changed="false"
          changed_files=""

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch: production deploy is required as a fail-safe."
            kanji_slicer_changed="true"
          else
            before_sha="$(jq -r '.before // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)"
            zero_sha="0000000000000000000000000000000000000000"

            if [[ "$before_sha" =~ ^[0-9a-f]{40}$ ]] && [ "$before_sha" != "$zero_sha" ] && git cat-file -e "$before_sha^{commit}" 2>/dev/null; then
              changed_files="$(git diff --name-only --no-renames "$before_sha" "$GITHUB_SHA" 2>/dev/null || true)"

              if [ -n "$changed_files" ]; then
                echo "Changed files:"
                printf '%s\n' "$changed_files"

                if impact_json="$(printf '%s\n' "$changed_files" | node .github/scripts/detect-deploy-impact.cjs)"; then
                  printf '%s\n' "$impact_json" | jq .
                  deploy_needed="$(jq -r '.deployNeeded' <<< "$impact_json")"
                  if [ "$deploy_needed" != "true" ] && [ "$deploy_needed" != "false" ]; then
                    echo "::warning::Deploy impact classifier returned an invalid value; deploying as a fail-safe."
                    deploy_needed="true"
                  fi
                else
                  echo "::warning::Deploy impact classifier failed; deploying as a fail-safe."
                  deploy_needed="true"
                fi

                if printf '%s\n' "$changed_files" | grep -qE '^kanji-slicer/'; then
                  kanji_slicer_changed="true"
                fi
              else
                echo "::warning::No changed files were detected; deploying as a fail-safe."
              fi
            else
              echo "::warning::Push base commit is unavailable in the checkout; deploying as a fail-safe."
            fi
          fi

          echo "deploy_needed=$deploy_needed" >> "$GITHUB_OUTPUT"
          echo "kanji_slicer_changed=$kanji_slicer_changed" >> "$GITHUB_OUTPUT"
          echo "Production deploy: $deploy_needed"
          echo "Kanji slicer extra deploy: $kanji_slicer_changed"

      - name: Skip production deployment
        if: steps.changes.outputs.deploy_needed != 'true'
        run: echo "No public artifact or deploy-time build input changed; Xserver deployment is skipped."

      - name: Validate static site
        if: steps.changes.outputs.deploy_needed == 'true'
        run: |
          pwsh -File ./scripts/static-site-smoke-test.ps1
          pwsh -File ./scripts/home-asset-smoke-test.ps1
          pwsh -File ./scripts/structure-smoke-test.ps1
          pwsh -File ./scripts/local-reference-check.ps1
          pwsh -File ./scripts/deploy-public-artifact-smoke-test.ps1
          pwsh -File ./scripts/viewport-accessibility-smoke-test.ps1
          pwsh -File ./scripts/deploy-security-smoke-test.ps1
          pwsh -File ./scripts/deploy-impact-smoke-test.ps1
          bash -n ./scripts/verify-deployment-marker.sh
          bash -n ./.github/scripts/rsync-transient-retry.sh
          node --check ./.github/scripts/detect-deploy-impact.cjs
          node --check ./scripts/verify-live-minigame-routes.mjs

      - name: Setup Node.js for minigame regression tests
        if: steps.changes.outputs.deploy_needed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install locked minigame test dependencies
        if: steps.changes.outputs.deploy_needed == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate minigame logic before deploy
        if: steps.changes.outputs.deploy_needed == 'true'
        run: npm run test:minigames:smoke

      - name: Resolve runner Chrome for predeploy regression
        if: steps.changes.outputs.deploy_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$chrome_path" ]; then
            echo "::error::Google Chrome is not available on this GitHub-hosted runner image"
            exit 1
          fi
          "$chrome_path" --version
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Validate minigame browser behavior before deploy
        if: steps.changes.outputs.deploy_needed == 'true'
        run: npm run test:minigames:browser

      - name: Generate sitemap.xml
        if: steps.changes.outputs.deploy_needed == 'true'
        run: pwsh -File ./scripts/generate-sitemap.ps1

      - name: Stamp deployment version
        if: steps.changes.outputs.deploy_needed == 'true'
        shell: bash
        run: printf '%s\n' "$GITHUB_SHA" > deploy-version.txt

      - name: Prepare public deployment artifact
        if: steps.changes.outputs.deploy_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_DIR="$RUNNER_TEMP/corner-neighbor-public"
          rm -rf "$PUBLIC_DIR"
          mkdir -p "$PUBLIC_DIR"

          rsync -a \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "scripts/" \
            --exclude "node_modules/" \
            --exclude "_codex_screens/" \
            --exclude "package.json" \
            --exclude "package-lock.json" \
            --exclude "playwright-report/" \
            --exclude "test-results/" \
            --exclude "assets/css/custom.dev.css" \
            --exclude "assets/css/components/" \
            --exclude "assets/js/ie/" \
            --exclude "*.py" \
            --exclude "*.md" \
            --exclude ".gitignore" \
            --exclude ".gitattributes" \
            --exclude ".gitlab-ci.yml" \
            ./ "$PUBLIC_DIR/"

          test -f "$PUBLIC_DIR/index.html"
          test -f "$PUBLIC_DIR/deploy-version.txt"
          test -f "$PUBLIC_DIR/assets/css/custom.css"
          test ! -e "$PUBLIC_DIR/node_modules"
          test ! -e "$PUBLIC_DIR/_codex_screens"
          test ! -e "$PUBLIC_DIR/package.json"
          test ! -e "$PUBLIC_DIR/package-lock.json"
          test ! -e "$PUBLIC_DIR/assets/css/custom.dev.css"
          test ! -e "$PUBLIC_DIR/assets/css/components"
          test ! -e "$PUBLIC_DIR/assets/js/ie"
          echo "PUBLIC_DIR=$PUBLIC_DIR" >> "$GITHUB_ENV"

      - name: Setup SSH
        if: steps.changes.outputs.deploy_needed == 'true'
        env:
          XS_SSH_KEY: ${{ secrets.XS_SSH_KEY }}
          XS_HOST: ${{ secrets.XS_HOST }}
          XS_PORT: ${{ secrets.XS_PORT }}
        run: |
          set -euo pipefail
          umask 077

          : "${XS_SSH_KEY:?XS_SSH_KEY secret is required}"
          : "${XS_HOST:?XS_HOST secret is required}"
          : "${XS_PORT:?XS_PORT secret is required}"

          if [ "$XS_HOST" != "hajikkoroom.xsrv.jp" ] || [ "$XS_PORT" != "10022" ]; then
            echo "::error::Unexpected Xserver SSH endpoint; refusing to use an unpinned host."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$XS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -P '' -f ~/.ssh/id_deploy >/dev/null

          cat > ~/.ssh/known_hosts <<'EOF'
          [hajikkoroom.xsrv.jp]:10022 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEKKSe2ENjD1KRgSqCY7ji78s0zqCNCKBRNfRaxRV7sh
          EOF
          chmod 600 ~/.ssh/known_hosts
          unset XS_SSH_KEY

      - name: Deploy to Xserver via Rsync
        if: steps.changes.outputs.deploy_needed == 'true'
        env:
          XS_HOST: ${{ secrets.XS_HOST }}
          XS_PORT: ${{ secrets.XS_PORT }}
          XS_USER: ${{ secrets.XS_USER }}
          XS_REMOTE_DIR: ${{ secrets.XS_REMOTE_DIR }}
        run: |
          set -euo pipefail
          source .github/scripts/rsync-transient-retry.sh
          ssh_opts="-p 10022 -i $HOME/.ssh/id_deploy -o BatchMode=yes -o IdentitiesOnly=yes -o PubkeyAuthentication=yes -o PreferredAuthentications=publickey -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o ForwardAgent=no -o ClearAllForwardings=yes -o RequestTTY=no -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o LogLevel=ERROR -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2"

          # Only the prepared public artifact is mirrored to the web root.
          # Preserve server-managed metadata that is intentionally outside the artifact.
          run_with_transient_retry "Main site rsync" 3 rsync -avz --delete \
            --exclude ".git/" \
            --exclude ".well-known/" \
            -e "ssh $ssh_opts" \
            "$PUBLIC_DIR/" $XS_USER@$XS_HOST:$XS_REMOTE_DIR

      - name: Deploy kanji-slicer to playpoint-sim.com
        if: steps.changes.outputs.deploy_needed == 'true' && steps.changes.outputs.kanji_slicer_changed == 'true'
        env:
          XS_HOST: ${{ secrets.XS_HOST }}
          XS_PORT: ${{ secrets.XS_PORT }}
          XS_USER: ${{ secrets.XS_USER }}
        run: |
          set -euo pipefail
          source .github/scripts/rsync-transient-retry.sh
          ssh_opts="-p 10022 -i $HOME/.ssh/id_deploy -o BatchMode=yes -o IdentitiesOnly=yes -o PubkeyAuthentication=yes -o PreferredAuthentications=publickey -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o ForwardAgent=no -o ClearAllForwardings=yes -o RequestTTY=no -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o LogLevel=ERROR -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2"

          run_with_transient_retry "kanji-slicer rsync" 3 rsync -avz --delete \
            -e "ssh $ssh_opts" \
            ./kanji-slicer/ $XS_USER@$XS_HOST:/home/hajikkoroom/playpoint-sim.com/public_html/kanji-slicer/

      - name: Verify deployed commit
        if: success() && steps.changes.outputs.deploy_needed == 'true'
        shell: bash
        run: bash ./scripts/verify-deployment-marker.sh "https://hajikkoroom.xsrv.jp/deploy-version.txt" "$GITHUB_SHA"

      - name: Verify live minigame routes
        if: success() && steps.changes.outputs.deploy_needed == 'true'
        shell: bash
        run: node ./scripts/verify-live-minigame-routes.mjs "https://hajikkoroom.xsrv.jp/" "$GITHUB_SHA"

      - name: SEO deploy confirmation
        if: success() && steps.changes.outputs.deploy_needed == 'true'
        run: |
          echo "✅ デプロイ完了 + sitemap.xml 更新済み + commit marker / live minigame routes 検証済み"
          echo ""
          echo "📋 SEO 状況:"
          echo "  - sitemap.xml がサーバーに配置されました"
          echo "  - Google: Search Console に sitemap を登録済みであれば自動クロールされます"
          echo "  - 参考: https://hajikkoroom.xsrv.jp/sitemap.xml"

      - name: Remove SSH material
        if: always() && steps.changes.outputs.deploy_needed == 'true'
        shell: bash
        run: rm -f ~/.ssh/id_deploy ~/.ssh/known_hosts
