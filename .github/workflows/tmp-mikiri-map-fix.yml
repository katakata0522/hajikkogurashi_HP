name: Temporary Mikiri Element Map Fix

on:
  push:
    branches:
      - test/mikiri-refactor-guard-20260910

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[mikiri-map-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: test/mikiri-refactor-guard-20260910
      - name: Patch only the missing DOM reference
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mikiri-issen/index.html')
          text = path.read_text(encoding='utf-8')
          old = "        titleBestLabel: document.getElementById('titleBestLabel'),\n        titleMaxStreakLabel: document.getElementById('titleMaxStreakLabel'),\n        toast: document.getElementById('toast'),"
          new = "        titleBestLabel: document.getElementById('titleBestLabel'),\n        titleMaxStreakLabel: document.getElementById('titleMaxStreakLabel'),\n        titleTotalWinsLabel: document.getElementById('titleTotalWinsLabel'),\n        toast: document.getElementById('toast'),"

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one target block, found {count}')

          patched = text.replace(old, new, 1)
          if patched.count("titleTotalWinsLabel: document.getElementById('titleTotalWinsLabel')") != 1:
              raise SystemExit('patched mapping invariant failed')

          path.write_text(patched, encoding='utf-8')
          PY
      - name: Commit exact repair
        shell: bash
        run: |
          if git diff --quiet -- mikiri-issen/index.html; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mikiri-issen/index.html
          git commit -m 'fix: register Mikiri total-wins element [mikiri-map-fixed]'
          git push origin HEAD:test/mikiri-refactor-guard-20260910
