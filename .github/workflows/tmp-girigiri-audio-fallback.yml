name: Temporary Girigiri Audio Fallback Patch

on:
  push:
    branches:
      - fix/girigiri-audio-fallback-20260911

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: fix/girigiri-audio-fallback-20260911
      - name: Apply exact runtime and regression patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          game = Path('girigiri-brake/script.js')
          text = game.read_text(encoding='utf-8')
          old = '\n'.join([
              '    init() {',
              '        if (this.isMuted) return;',
              '        if (!this.audioCtx) {',
              '            const AudioContext = window.AudioContext || window.webkitAudioContext;',
              '            this.audioCtx = new AudioContext();',
              '        }',
              "        if (this.audioCtx.state === 'suspended') {",
              '            this.audioCtx.resume();',
              '        }',
              '    }',
          ])
          new = '\n'.join([
              '    init() {',
              '        if (this.isMuted) return;',
              '        if (!this.audioCtx) {',
              '            const AudioContextClass = window.AudioContext || window.webkitAudioContext;',
              '            if (!AudioContextClass) return;',
              '            try {',
              '                this.audioCtx = new AudioContextClass();',
              '            } catch (_) {',
              '                this.audioCtx = null;',
              '                return;',
              '            }',
              '        }',
              "        if (this.audioCtx.state === 'suspended') {",
              '            try {',
              '                const resumeResult = this.audioCtx.resume();',
              "                if (resumeResult && typeof resumeResult.catch === 'function') {",
              '                    resumeResult.catch(() => {});',
              '                }',
              '            } catch (_) {}',
              '        }',
              '    }',
          ])
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one AudioManager.init block, got {text.count(old)}')
          game.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('scripts/girigiri-brake-browser-test.mjs')
          test_text = test.read_text(encoding='utf-8')
          anchor = '\n'.join([
              '  await storagePage.close();',
              "  console.log('girigiri-brake browser test passed');",
          ])
          addition = '\n'.join([
              '  await storagePage.close();',
              '',
              '  const noAudioPage = await browser.newPage({ viewport: { width: 390, height: 844 } });',
              '  const noAudioErrors = [];',
              "  noAudioPage.on('pageerror', (error) => noAudioErrors.push(error.message));",
              '  await noAudioPage.addInitScript(() => {',
              '    Object.defineProperties(window, {',
              '      AudioContext: { value: undefined, configurable: true },',
              '      webkitAudioContext: { value: undefined, configurable: true },',
              '    });',
              '  });',
              '',
              "  await noAudioPage.goto(`http://127.0.0.1:${port}/girigiri-brake/`, { waitUntil: 'networkidle' });",
              "  await noAudioPage.click('#start-btn');",
              '  await noAudioPage.waitForTimeout(100);',
              '',
              '  const noAudioState = await noAudioPage.evaluate(() => ({',
              "    startActive: document.querySelector('#start-screen')?.classList.contains('active') ?? false,",
              "    hudActive: document.querySelector('#hud')?.classList.contains('active') ?? false,",
              "    status: document.querySelector('#status-text')?.textContent?.trim() ?? null,",
              '  }));',
              '',
              '  if (',
              '    noAudioErrors.length ||',
              '    noAudioState.startActive ||',
              '    !noAudioState.hudActive ||',
              "    noAudioState.status !== 'TAP TO GO!'",
              '  ) {',
              '    throw new Error(`missing Web Audio API should not break Girigiri: ${JSON.stringify({ noAudioState, noAudioErrors })}`);',
              '  }',
              '',
              '  await noAudioPage.close();',
              "  console.log('girigiri-brake browser test passed');",
          ])
          if test_text.count(anchor) != 1:
              raise SystemExit(f'expected exactly one browser-test anchor, got {test_text.count(anchor)}')
          test.write_text(test_text.replace(anchor, addition, 1), encoding='utf-8')
          PY

          rm .github/workflows/tmp-girigiri-audio-fallback.yml
          git diff --check
          git diff -- girigiri-brake/script.js scripts/girigiri-brake-browser-test.mjs
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add girigiri-brake/script.js scripts/girigiri-brake-browser-test.mjs .github/workflows/tmp-girigiri-audio-fallback.yml
          git commit -m "fix: allow Girigiri to run without Web Audio"
          git push origin HEAD:fix/girigiri-audio-fallback-20260911
