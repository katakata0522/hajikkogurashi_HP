name: Kanji Recipe Refactor One Shot

on:
  push:
    branches:
      - refactor/kanji-recipe-map-20260911
    paths:
      - '.github/workflows/kanji-recipe-refactor-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refactor/kanji-recipe-map-20260911
      - name: Verify exact source blobs
        shell: bash
        run: |
          test "$(git hash-object kanji-slicer/game.js)" = "531188b065f2d9d46e92bc982686377533e05831"
          test "$(git hash-object scripts/kanji-slicer-data-integrity-smoke-test.mjs)" = "1c8c637ead0ac3b3173e3945c1caf7346021286d"
          test "$(git hash-object scripts/kanji-slicer-browser-test.mjs)" = "1c6dad2eb323db384256653d8274ce3c8b909af3"
      - name: Apply constrained refactor
        run: node scripts/apply-kanji-recipe-refactor.mjs
      - name: Run smoke suite before commit
        run: npm run test:minigames:smoke
      - name: Remove one-shot helpers and commit result
        shell: bash
        run: |
          rm scripts/apply-kanji-recipe-refactor.mjs
          rm .github/workflows/kanji-recipe-refactor-once.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: normalize Kanji recipe lookup and storage"
          git push origin HEAD:refactor/kanji-recipe-map-20260911
