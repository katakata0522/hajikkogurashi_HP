name: Sorting Rule ID Refactor One Shot

on:
  push:
    branches:
      - refactor/sorting-rule-ids-20260911
    paths:
      - '.github/workflows/sorting-rule-id-refactor-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refactor/sorting-rule-ids-20260911
      - name: Verify exact source blobs
        shell: bash
        run: |
          test "$(git hash-object sorting-factory/script.js)" = "0b76e6b9c6f577c6eb947c4f226c2ae1b6fedacb"
          test "$(git hash-object scripts/sorting-factory-smoke-test.mjs)" = "145e197dca18623653b56b7f6e97a572afd31c0c"
          test "$(git hash-object scripts/sorting-factory-browser-test.mjs)" = "949c78ada9c1434f19ca0473bd75792377ea6e2e"
      - name: Apply rule ID separation
        run: node scripts/apply-sorting-rule-id-refactor.mjs
      - name: Run smoke suite before commit
        run: npm run test:minigames:smoke
      - name: Remove one-shot helpers and commit result
        shell: bash
        run: |
          rm scripts/apply-sorting-rule-id-refactor.mjs
          rm .github/workflows/sorting-rule-id-refactor-once.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: separate Sorting rule IDs from labels"
          git push origin HEAD:refactor/sorting-rule-ids-20260911
