name: LUMEN Editor Extract One Shot

on:
  push:
    branches:
      - refactor/lumen-editor-extension-20260911
    paths:
      - '.github/workflows/lumen-editor-extract-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refactor/lumen-editor-extension-20260911
      - name: Verify exact source blobs
        shell: bash
        run: |
          test "$(git hash-object lumen-mirror/index.html)" = "19d0bb484b169cde9e7590af23d54aca6eab09b4"
          test "$(git hash-object lumen-mirror/script.js)" = "683f33c67ddfb323b33fe85933ace642570365cf"
          test "$(git hash-object lumen-mirror/core.js)" = "702182a68e37890b3732f1b5733b804f6a08c73a"
          test "$(git hash-object lumen-mirror/stages.js)" = "99dbe2de7a076b9016c58cabbca360954d564b16"
          test "$(git hash-object scripts/lumen-mirror-smoke-test.mjs)" = "e23ac6bc4cd4b70a1e0a89aecec914fa2dffab86"
          test ! -e lumen-mirror/editor.js
      - name: Extract Stage Editor methods
        run: node scripts/apply-lumen-editor-extract.mjs
      - name: Run smoke suite before commit
        run: npm run test:minigames:smoke
      - name: Remove one-shot helpers and commit result
        shell: bash
        run: |
          rm scripts/apply-lumen-editor-extract.mjs
          rm .github/workflows/lumen-editor-extract-once.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extract LUMEN editor extension"
          git push origin HEAD:refactor/lumen-editor-extension-20260911
