name: Static Site Check

on:
  push:
    branches: ['verified/**']
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: static-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.scope.outputs.browser }}
      runtime: ${{ steps.runtime.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select browser checks against main
        id: scope
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${PR_BASE:-origin/main}"
          git merge-base --is-ancestor "$base" HEAD
          if git diff --quiet "$base" HEAD -- . ':(exclude,glob)**/*.md' ':(exclude).gitignore' ':(exclude).gitattributes'; then
            echo 'browser=false' >> "$GITHUB_OUTPUT"
          else
            result=$?
            test "$result" -eq 1
            echo 'browser=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Run site smoke tests
        id: site
        run: bash .github/scripts/check-static-site.sh
      - name: Identify passing static check environment
        id: runtime
        if: steps.site.outcome == 'success'
        run: bash .github/scripts/regression-runtime.sh static
      - name: Check workflow configuration and deployment decisions
        run: |
          pwsh -File ./scripts/workflow-action-pin-smoke-test.ps1
          node --test .github/scripts/plan-deployment.test.cjs
          bash .github/scripts/stage-public.test.sh

  minigame-check:
    needs: static-check
    if: needs.static-check.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test minigame screenshot collection
        run: node scripts/minigame-screenshots-test.mjs
      - name: Build the public files for candidate browser tests
        id: built
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/verified/')
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD --
          pwsh -File ./scripts/generate-sitemap.ps1
          printf '%s\n' "$GITHUB_SHA" > deploy-version.txt
          bash .github/scripts/stage-public.sh
      - name: Resolve runner Chrome
        id: runtime
        run: bash .github/scripts/regression-runtime.sh browser
      - name: Run minigame and mail regressions
        id: minigame-browser
        uses: ./.github/actions/check-minigames
        with:
          screenshot-directory: test-results/minigame-screenshots
      - name: Upload minigame screenshots
        if: ${{ !cancelled() && steps.minigame-browser.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minigame-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/minigame-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
          include-hidden-files: false
      - name: Record passing checks for this checkout
        id: receipt
        if: >-
          success() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/verified/') &&
          steps.minigame-browser.outcome == 'success' &&
          needs.static-check.outputs.runtime != '' && steps.runtime.outputs.fingerprint != '' && steps.built.outputs.digest != ''
        env:
          TESTED_DIGEST: ${{ steps.built.outputs.digest }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          recheck_dir="$RUNNER_TEMP/hp-recheck"
          mkdir "$recheck_dir"
          RUNNER_TEMP="$recheck_dir" GITHUB_OUTPUT="$recheck_dir/output" bash .github/scripts/stage-public.sh
          grep -Fxq "digest=$TESTED_DIGEST" "$recheck_dir/output"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/hp-regressions.txt"
      - name: Make passing checks available to deployment
        if: steps.receipt.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hp-regressions-v2-${{ github.run_attempt }}-${{ github.sha }}-${{ needs.static-check.outputs.runtime }}-${{ steps.built.outputs.digest }}
          path: ${{ runner.temp }}/hp-regressions.txt
          if-no-files-found: error
          retention-days: 7

  release-checks:
    name: hp-release-checks
    if: always()
    needs: [static-check, minigame-check]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require selected checks for this revision
        env:
          STATIC: ${{ needs.static-check.result }}
          BROWSER: ${{ needs.static-check.outputs.browser }}
          BROWSER_RESULT: ${{ needs.minigame-check.result }}
        run: |
          set -eu
          test "$STATIC" = success
          case "$BROWSER:$BROWSER_RESULT" in
            true:success|false:skipped) ;;
            *) echo "::error::browser=$BROWSER result=$BROWSER_RESULT"; exit 1 ;;
          esac
