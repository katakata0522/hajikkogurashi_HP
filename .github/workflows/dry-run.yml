name: Static Site Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'

permissions:
  contents: read

concurrency:
  group: static-check-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-check:
    # Draft iterations must not consume shared Actions minutes.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Run site smoke tests
        run: |
          pwsh -File ./scripts/static-site-smoke-test.ps1
          pwsh -File ./scripts/home-asset-smoke-test.ps1
          node --test ./scripts/home-v2-contract.test.cjs
          pwsh -File ./scripts/structure-smoke-test.ps1
          pwsh -File ./scripts/local-reference-check.ps1
          pwsh -File ./scripts/workflow-action-pin-smoke-test.ps1
          pwsh -File ./scripts/deploy-public-artifact-smoke-test.ps1
          pwsh -File ./scripts/viewport-accessibility-smoke-test.ps1
          pwsh -File ./scripts/deploy-security-smoke-test.ps1
          pwsh -File ./scripts/deploy-impact-smoke-test.ps1
          bash -n ./.github/scripts/rsync-transient-retry.sh
          node --check ./.github/scripts/detect-deploy-impact.cjs

  minigame-check:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run minigame smoke tests
        run: |
          npm run test:site
          node scripts/kanji-slicer-asset-version-smoke-test.mjs
          node scripts/minigame-screenshots-test.mjs
          npm run test:minigames:smoke
      - name: Resolve runner Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$chrome_path" ]; then
            echo "::error::Google Chrome is not available on this GitHub-hosted runner image"
            exit 1
          fi
          "$chrome_path" --version
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Run minigame browser tests
        id: minigame-browser
        env:
          MINIGAME_SCREENSHOT_DIR: test-results/minigame-screenshots
        run: |
          npm run test:site:browser
          npm run test:minigames:browser
      - name: Upload minigame screenshots
        if: ${{ !cancelled() && steps.minigame-browser.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: minigame-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/minigame-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
          include-hidden-files: false
