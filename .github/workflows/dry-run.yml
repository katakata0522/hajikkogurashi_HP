name: Static Site Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: static-check-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select browser checks against main
        id: scope
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${PR_BASE:-origin/main}"
          git merge-base --is-ancestor "$base" HEAD
          if git diff --quiet "$base" HEAD -- . ':(exclude,glob)**/*.md' ':(exclude).gitignore' ':(exclude).gitattributes'; then
            echo 'browser=false' >> "$GITHUB_OUTPUT"
          else
            result=$?
            test "$result" -eq 1
            echo 'browser=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Run site smoke tests
        run: |
          pwsh -File ./scripts/static-site-smoke-test.ps1
          pwsh -File ./scripts/home-asset-smoke-test.ps1
          pwsh -File ./scripts/structure-smoke-test.ps1
          pwsh -File ./scripts/local-reference-check.ps1
          pwsh -File ./scripts/workflow-action-pin-smoke-test.ps1
          pwsh -File ./scripts/deploy-public-artifact-smoke-test.ps1
          pwsh -File ./scripts/viewport-accessibility-smoke-test.ps1
          pwsh -File ./scripts/deploy-security-smoke-test.ps1
          pwsh -File ./scripts/deploy-impact-smoke-test.ps1
          bash -n ./.github/scripts/rsync-transient-retry.sh
          node --check ./.github/scripts/detect-deploy-impact.cjs

  minigame-check:
    needs: static-check
    if: needs.static-check.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run minigame smoke tests
        run: |
          node scripts/minigame-screenshots-test.mjs
          npm run test:minigames:smoke
      - name: Resolve runner Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$chrome_path" ]; then
            echo "::error::Google Chrome is not available on this GitHub-hosted runner image"
            exit 1
          fi
          "$chrome_path" --version
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Check mail contact across viewport and script settings
        run: node scripts/mail-contact-browser-test.mjs
      - name: Run minigame browser tests
        id: minigame-browser
        env:
          MINIGAME_SCREENSHOT_DIR: test-results/minigame-screenshots
        run: npm run test:minigames:browser
      - name: Upload minigame screenshots
        if: ${{ !cancelled() && steps.minigame-browser.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: minigame-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/minigame-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
          include-hidden-files: false

  release-checks:
    name: hp-release-checks
    if: always()
    needs: [static-check, minigame-check]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require selected checks for this revision
        env:
          STATIC: ${{ needs.static-check.result }}
          BROWSER: ${{ needs.static-check.outputs.browser }}
          BROWSER_RESULT: ${{ needs.minigame-check.result }}
        run: |
          set -eu
          test "$STATIC" = success
          case "$BROWSER:$BROWSER_RESULT" in
            true:success|false:skipped) ;;
            *) echo "::error::browser=$BROWSER result=$BROWSER_RESULT"; exit 1 ;;
          esac
