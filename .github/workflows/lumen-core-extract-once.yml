name: LUMEN Core Extract One Shot

on:
  push:
    branches:
      - refactor/lumen-core-runtime-20260911
    paths:
      - '.github/workflows/lumen-core-extract-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refactor/lumen-core-runtime-20260911
      - name: Verify exact source blobs
        shell: bash
        run: |
          test "$(git hash-object lumen-mirror/index.html)" = "39695886a79f2b811fe3946c83375aef5b281306"
          test "$(git hash-object lumen-mirror/script.js)" = "b60c68fc42fa5a4b799935c07405bf59e07d4144"
          test "$(git hash-object lumen-mirror/stages.js)" = "99dbe2de7a076b9016c58cabbca360954d564b16"
          test "$(git hash-object scripts/lumen-mirror-smoke-test.mjs)" = "f97c1495e1bb077e718185e3c85837546e285aba"
          test ! -e lumen-mirror/core.js
      - name: Extract core runtime dependencies
        run: node scripts/apply-lumen-core-extract.mjs
      - name: Run smoke suite before commit
        run: npm run test:minigames:smoke
      - name: Remove one-shot helpers and commit result
        shell: bash
        run: |
          rm scripts/apply-lumen-core-extract.mjs
          rm .github/workflows/lumen-core-extract-once.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extract LUMEN core runtime"
          git push origin HEAD:refactor/lumen-core-runtime-20260911
