name: Production site read-only smoke

on:
  pull_request:
    paths:
      - ".github/workflows/live-site-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-site-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install locked smoke test dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Verify the live revision contains the current public inputs
        id: revision
        run: node .github/scripts/plan-deployment.cjs --live-revision
      - name: Verify the published commit SHA
        env:
          EXPECTED_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          bash ./scripts/verify-deployment-marker.sh "https://hajikkoroom.xsrv.jp/deploy-version.txt" "$EXPECTED_SHA"
      - name: Verify live minigame URLs and static content
        env:
          EXPECTED_SHA: ${{ steps.revision.outputs.sha }}
        run: node ./scripts/verify-live-minigame-routes.mjs "https://hajikkoroom.xsrv.jp/" "$EXPECTED_SHA"
