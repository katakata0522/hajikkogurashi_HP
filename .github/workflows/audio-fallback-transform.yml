name: One-shot audio fallback transform

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply-audio-fallbacks.mjs'
      - '.github/workflows/audio-fallback-transform.yml'

permissions:
  contents: write

jobs:
  transform:
    if: github.head_ref == 'test/audio-constructor-resilience-20260911'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply diagnosed audio fallbacks
        run: node scripts/apply-audio-fallbacks.mjs
      - name: Remove one-shot transformer
        run: rm scripts/apply-audio-fallbacks.mjs .github/workflows/audio-fallback-transform.yml
      - name: Commit exact transformation
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No transformation changes found'; exit 1; }
          git commit -m 'fix: degrade gracefully when Web Audio construction is blocked'
          git push origin "HEAD:$HEAD_BRANCH"
