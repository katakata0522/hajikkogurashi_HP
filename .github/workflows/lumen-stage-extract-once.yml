name: LUMEN Stage Extract One Shot

on:
  push:
    branches:
      - refactor/lumen-stage-data-20260911
    paths:
      - '.github/workflows/lumen-stage-extract-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refactor/lumen-stage-data-20260911
      - name: Verify exact source blobs
        shell: bash
        run: |
          test "$(git hash-object lumen-mirror/index.html)" = "33a04cb5b19434f44b6260f6ef309cd5ab903a28"
          test "$(git hash-object lumen-mirror/script.js)" = "cac251a3bc010078248926817f532a15f5170c11"
          test "$(git hash-object scripts/lumen-mirror-smoke-test.mjs)" = "7fbdfc9443cf4137a9a3d1071192de9417ae86d0"
          test ! -e lumen-mirror/stages.js
      - name: Extract stage database
        run: node scripts/apply-lumen-stage-extract.mjs
      - name: Run smoke suite before commit
        run: npm run test:minigames:smoke
      - name: Remove one-shot helpers and commit result
        shell: bash
        run: |
          rm scripts/apply-lumen-stage-extract.mjs
          rm .github/workflows/lumen-stage-extract-once.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extract LUMEN stage data"
          git push origin HEAD:refactor/lumen-stage-data-20260911
